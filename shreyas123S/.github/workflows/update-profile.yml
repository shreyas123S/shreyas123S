name: Update Profile Dashboard

on:
  schedule:
    # Run once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master

concurrency:
  group: profile-dashboard
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Dashboard SVGs
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          # You will need to create a Personal Access Token (classic) with `read:user` and `repo` scopes
          # and save it as a repository secret named `STATS_TOKEN`.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node scripts/generate-dashboard.mjs

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/svg/overview.svg assets/svg/streak.svg assets/svg/languages.svg assets/svg/activity.svg assets/svg/metrics.svg assets/svg/profile.svg
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "chore: update terminal dashboard [skip ci]"
          git push
