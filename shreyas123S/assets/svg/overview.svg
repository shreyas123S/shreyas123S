<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #09090b; }
    .border { stroke: #27272a; stroke-width: 1; }
    .text-main { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #f4f4f5; }
    .text-sub { font-family: Consolas, 'Courier New', monospace; font-size: 12px; fill: #a1a1aa; }
    .text-dim { font-family: Consolas, 'Courier New', monospace; font-size: 11px; fill: #52525b; }
    .text-bold { font-weight: 700; }
    .text-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #a1a1aa; text-transform: uppercase; letter-spacing: 1px; }
    .accent-green { fill: #4ade80; }
    .accent-cyan { fill: #22d3ee; }
    .accent-amber { fill: #fbbf24; }
    .accent-pink { fill: #f472b6; }
  </style>
  <!-- Background -->
  <rect x="0.5" y="0.5" width="399" height="199" rx="0" class="bg border"/>
  
  <!-- Terminal Header line -->
  <rect x="0" y="0" width="400" height="24" fill="#27272a" opacity="0.3"/>
  <circle cx="12" cy="12" r="3.5" fill="#ef4444" opacity="0.8"/>
  <circle cx="24" cy="12" r="3.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="36" cy="12" r="3.5" fill="#10b981" opacity="0.8"/>
  <text x="200" y="15.5" class="text-sans" text-anchor="middle" fill="#52525b">~/dashboard</text>

  <!-- Body -->
  <g transform="translate(0, 24)">
    
    <text x="24" y="32" class="text-main text-bold" font-size="20" letter-spacing="2">SHREYAS123S</text>
    <text x="24" y="44" class="text-dim">────────────────────────────────────────────────</text>
    
    <text x="24" y="70" class="text-main">Status      <tspan class="accent-green">● ACTIVE DEVELOPER</tspan></text>
    <text x="24" y="90" class="text-main">Repos       <tspan class="text-sub">45</tspan></text>
    <text x="24" y="110" class="text-main">Contribs    <tspan class="text-sub">650</tspan></text>
    <text x="24" y="130" class="text-main">Cur Streak  <tspan class="accent-cyan">1 days</tspan></text>
    
    <text x="24" y="160" class="text-sub">_></text><rect x="42" y="150" width="8" height="12" class="accent-green">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  
  </g>
</svg>