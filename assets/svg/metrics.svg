<svg width="260" height="200" viewBox="0 0 260 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #09090b; }
    .border { stroke: #27272a; stroke-width: 1; }
    .text-main { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #f4f4f5; }
    .text-sub { font-family: Consolas, 'Courier New', monospace; font-size: 12px; fill: #a1a1aa; }
    .text-dim { font-family: Consolas, 'Courier New', monospace; font-size: 11px; fill: #52525b; }
    .text-bold { font-weight: 700; }
    .text-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #a1a1aa; text-transform: uppercase; letter-spacing: 1px; }
    .accent-green { fill: #4ade80; }
    .accent-cyan { fill: #22d3ee; }
    .accent-amber { fill: #fbbf24; }
    .accent-pink { fill: #f472b6; }
  </style>
  <!-- Background -->
  <rect x="0.5" y="0.5" width="259" height="199" rx="0" class="bg border"/>
  
  <!-- Terminal Header line -->
  <rect x="0" y="0" width="260" height="24" fill="#27272a" opacity="0.3"/>
  <circle cx="12" cy="12" r="3.5" fill="#ef4444" opacity="0.8"/>
  <circle cx="24" cy="12" r="3.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="36" cy="12" r="3.5" fill="#10b981" opacity="0.8"/>
  <text x="130" y="15.5" class="text-sans" text-anchor="middle" fill="#52525b">~/dashboard</text>

  <!-- Body -->
  <g transform="translate(0, 24)">
    
    <text x="24" y="30" class="text-sans">DEVELOPER METRICS</text>
    
    <text x="24" y="65" class="text-main">><tspan x="40" class="text-sub">REPOSITORIES</tspan></text>
    <text x="200" y="65" class="accent-cyan text-bold">45</text>
    
    <text x="24" y="90" class="text-main">><tspan x="40" class="text-sub">PULL REQUESTS</tspan></text>
    <text x="200" y="90" class="accent-green text-bold">45</text>
    
    <text x="24" y="115" class="text-main">><tspan x="40" class="text-sub">ISSUES</tspan></text>
    <text x="200" y="115" class="accent-pink text-bold">12</text>
    
    <text x="24" y="140" class="text-main">><tspan x="40" class="text-sub">STARS EARNED</tspan></text>
    <text x="200" y="140" class="accent-amber text-bold">82</text>
    
    <text x="24" y="165" class="text-main">><tspan x="40" class="text-sub">FOLLOWERS</tspan></text>
    <text x="200" y="165" class="text-main text-bold">142</text>
  
  </g>
</svg>