<svg width="310" height="210" viewBox="0 0 310 210" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #09090b; }
    .border { stroke: #27272a; stroke-width: 1; }
    .text-main { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #f4f4f5; }
    .text-sub { font-family: Consolas, 'Courier New', monospace; font-size: 12px; fill: #a1a1aa; }
    .text-dim { font-family: Consolas, 'Courier New', monospace; font-size: 11px; fill: #52525b; }
    .text-bold { font-weight: 700; }
    .text-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #a1a1aa; text-transform: uppercase; letter-spacing: 1px; }
    .accent-green { fill: #4ade80; }
    .accent-cyan { fill: #22d3ee; }
    .accent-amber { fill: #fbbf24; }
    .accent-pink { fill: #f472b6; }
  </style>
  <!-- Background -->
  <rect x="0.5" y="0.5" width="309" height="209" rx="0" class="bg border"/>
  
