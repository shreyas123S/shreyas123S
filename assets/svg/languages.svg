
<svg width="700" height="60" viewBox="0 0 700 60" xmlns="http://www.w3.org/2000/svg">
  <style>
    .lg-bg      { fill: #0d1117; }
    .lg-border  { stroke: #30363d; stroke-width: 1; fill: none; }
    .lg-label   { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; fill: #c9d1d9; }
    .lg-pct     { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 9px; fill: #8b949e; }
    .lg-track   { fill: #21262d; rx: 2; }

    @media (prefers-color-scheme: light) {
      .lg-bg      { fill: #ffffff; }
      .lg-border  { stroke: #d0d7de; }
      .lg-label   { fill: #1f2328; }
      .lg-pct     { fill: #57606a; }
      .lg-track   { fill: #eaeef2; }
    }
  </style>

  <!-- Background -->
  <rect width="700" height="60" rx="0" class="lg-bg"/>
  <rect x="0.5" y="0.5" width="699" height="59" rx="0" class="lg-border"/>

  <!-- Bar track -->
  <rect x="24" y="12" width="652" height="8" rx="4" class="lg-track"/>

  <!-- Stacked segments -->
  
  
  
  <rect x="24" y="12" width="331.216" height="8" rx="4" fill="#DA5B0B"/>
  
  
  
  <rect x="355.216" y="12" width="212.55200000000002" height="8" rx="0" fill="#3178c6"/>
  
  
  
  <rect x="567.768" y="12" width="63.24399999999999" height="8" rx="0" fill="#3572A5"/>
  
  
  
  <rect x="631.0120000000001" y="12" width="26.080000000000002" height="8" rx="0" fill="#f1e05a"/>
  
  
  
  <rect x="657.0920000000001" y="12" width="16.952" height="8" rx="0" fill="#e34c26"/>
  
  

  <!-- Inline labels below the bar -->
  
  
  
  
  
  <text x="189.608" y="36" text-anchor="middle" class="lg-label">Jupyter Notebook</text>
  <text x="189.608" y="48" text-anchor="middle" class="lg-pct">50.8%</text>
  
  
  
  
  
  
  <text x="461.492" y="36" text-anchor="middle" class="lg-label">TypeScript</text>
  <text x="461.492" y="48" text-anchor="middle" class="lg-pct">32.6%</text>
  
  
  
  
  
  
  <text x="599.39" y="36" text-anchor="middle" class="lg-label">Python</text>
  <text x="599.39" y="48" text-anchor="middle" class="lg-pct">9.7%</text>
  
  
  
  
  
  
  
  
  
  
  
  
  
</svg>
